name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 23 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/update_market_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch daily data
        run: python scripts/update_market_data.py
      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market data changes"
            exit 0
          fi
          git config user.name "edge-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Refresh market data"
          git push
